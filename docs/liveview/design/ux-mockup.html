<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MediaBox 实况窗 UX 设计图</title>
<style>
  :root {
    --accent: #317AF7;
    --track-light: rgba(0,0,0,.10);
    --track-dark: rgba(255,255,255,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: #FFFFFF; color: #182030;
    padding: 48px 40px 64px;
  }
  h1 { font-size: 26px; font-weight: 700; text-align: center; letter-spacing: 1px; }
  .meta { text-align: center; color: #5A6B7C; font-size: 13px; margin: 10px 0 40px; }
  .version-title {
    font-size: 19px; font-weight: 700; color: #0B5CD5;
    border-left: 4px solid #0B5CD5; padding-left: 10px; margin: 28px 0 18px;
  }
  .state { margin-bottom: 44px; }
  .state h3 { font-size: 15px; font-weight: 600; color: #33475E; margin-bottom: 12px; }
  .row { display: flex; align-items: flex-start; gap: 28px; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { font-size: 12px; color: #7A8699; }

  /* ---------- 状态栏胶囊态 ---------- */
  .statusbar {
    width: 380px; height: 46px; border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 20px;
  }
  .sb-light { background: #F1F3F7; }
  .sb-dark  { background: #0D1117; }
  .sb-time { font-size: 15px; font-weight: 600; }
  .sb-light .sb-time { color: #1A2233; }
  .sb-dark  .sb-time { color: #F2F5F9; }
  .sb-right { display: flex; align-items: center; gap: 10px; }
  .sb-icons { display: flex; align-items: center; gap: 5px; opacity: .85; }
  .sb-light .sb-icons svg path, .sb-light .sb-icons svg rect { fill: #1A2233; }
  .sb-dark  .sb-icons svg path, .sb-dark  .sb-icons svg rect { fill: #F2F5F9; }

  .capsule {
    height: 34px; border-radius: 17px; padding: 0 12px 0 5px;
    display: flex; align-items: center; gap: 7px;
    background: linear-gradient(180deg, #2A2A2E 0%, #0A0A0A 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .app-badge {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: linear-gradient(180deg, #4C8DF6 0%, #0A59F7 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .app-badge svg { width: 13px; height: 13px; }
  .cap-main { color: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .cap-sub  { color: rgba(255,255,255,.92); font-size: 12px; white-space: nowrap; }
  .cap-progress {
    width: 34px; height: 34px; margin-right: -6px;
  }
  .cap-tail {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center;
  }
  .cap-tail svg { width: 11px; height: 11px; }

  /* ---------- 卡片态 ---------- */
  .card {
    width: 470px; border-radius: 26px; padding: 18px 20px 20px;
  }
  .card-light {
    background: #FFFFFF; border: 1px solid #E6EBF2;
    box-shadow: 0 10px 28px rgba(23,43,77,.10);
  }
  .card-dark {
    background: #1D222B; border: 1px solid #2C333F;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
  }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .card-icon {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: linear-gradient(180deg, #4C8DF6 0%, #0A59F7 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card-icon svg { width: 19px; height: 19px; }
  .card-titles { flex: 1; min-width: 0; }
  .card-title { font-size: 16px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-light .card-sub { color: #7A8699; }
  .card-dark  .card-sub { color: #9AA6B5; }
  .card-btn {
    flex: none; height: 26px; padding: 0 14px; border-radius: 13px;
    display: flex; align-items: center;
    font-size: 12px; font-weight: 600;
  }
  .card-light .card-btn { background: #EAF1FD; color: #0B5CD5; }
  .card-dark  .card-btn { background: rgba(49,122,247,.22); color: #7FB0FA; }
  .card-dark .card-title { color: #EAEFF5; }
  .lock-dark .lock-card .card-title { color: #EAEFF5; }
  .lock-dark .lock-card .card-dark-sub { color: #9AA6B5; }
  .card-dark .card-sub { color: #9AA6B5; }

  .track-wrap { margin-top: 18px; padding: 0 6px; }
  .track { position: relative; height: 4px; border-radius: 2px; }
  .card-light .track { background: var(--track-light); }
  .card-dark  .track { background: var(--track-dark); }
  .track-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; background: var(--accent); }
  .nodes { display: flex; justify-content: space-between; margin-top: -7px; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 96px; }
  .node-dot {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .node-dot svg { width: 10px; height: 10px; }
  .nd-done { background: var(--accent); }
  .nd-done svg path { stroke: #FFFFFF; }
  .nd-active { background: #FFFFFF; border: 2px solid var(--accent); }
  .card-dark .nd-active { background: #1D222B; }
  .nd-active svg path { stroke: var(--accent); }
  .nd-todo { background: transparent; border: 2px solid rgba(0,0,0,.18); }
  .card-dark .nd-todo { border-color: rgba(255,255,255,.28); }
  .nd-todo svg path { stroke: rgba(0,0,0,.34); }
  .card-dark .nd-todo svg path { stroke: rgba(255,255,255,.5); }
  .node-label { font-size: 11px; }
  .card-light .node-label { color: #5A6B7C; }
  .card-dark  .node-label { color: #9AA6B5; }
  .node-label.on { color: var(--accent); font-weight: 600; }
  .card-percent { text-align: right; font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 10px; }

  /* ---------- 锁屏态 ---------- */
  .lock {
    width: 300px; height: 480px; border-radius: 36px; overflow: hidden;
    position: relative; padding: 26px 18px 18px;
    border: 1px solid rgba(0,0,0,.08);
  }
  .lock-light { background: linear-gradient(180deg, #BFD7FF 0%, #E4D9FF 60%, #F3E9FF 100%); }
  .lock-dark  { background: linear-gradient(180deg, #0F182B 0%, #1D1430 100%); }
  .lock-clock { text-align: center; color: #FFFFFF; text-shadow: 0 1px 8px rgba(30,40,80,.35); }
  .lock-dark .lock-clock { text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .lock-clock .t { font-size: 54px; font-weight: 200; letter-spacing: 1px; line-height: 1.05; }
  .lock-clock .d { font-size: 12px; opacity: .92; margin-top: 2px; }
  .lock-body { position: absolute; left: 14px; right: 14px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .lock-card {
    border-radius: 20px; padding: 13px 14px;
    background: rgba(255,255,255,.86); backdrop-filter: blur(6px);
  }
  .lock-dark .lock-card { background: rgba(38,44,55,.88); }
  .lock-card .card-title { font-size: 14px; }
  .lock-card .card-sub { font-size: 12px; margin-top: 2px; }
  .lock-card .card-light-sub { color: #7A8699; }
  .lock-dark .lock-card .card-light-sub { color: #9AA6B5; }
  .lock-mini-track { margin-top: 9px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.10); position: relative; }
  .lock-dark .lock-mini-track { background: rgba(255,255,255,.12); }
  .lock-mini-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; background: var(--accent); }
  .lock-capsule { display: flex; justify-content: center; }
  .lock-capsule .capsule { height: 32px; }
  .lock-bottom { display: flex; justify-content: center; margin-top: 2px; }
  .lock-bottom svg { width: 16px; height: 16px; opacity: .9; }
</style>
</head>
<body>

              <div class="node"><div class="node-dot nd-done"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2 5 8.6 9.5 3.6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="node-label on">完成</span></div>

  <!-- ============ 深色版 ============ -->
  <div class="version-title">深色版（Dark）</div>
  <div id="dark-root"></div>

<script>
/* 深色版由脚本克隆浅色版三段并替换配色类，保证两版内容一致 */
const root = document.getElementById("dark-root");
for (let i = 1; i <= 3; i++) {
  const src = document.querySelector(".light-state-" + i);
  const clone = src.cloneNode(true);
  clone.classList.remove("light-state-" + i);
  clone.classList.add("dark-state-" + i);
  clone.querySelectorAll(".sb-light").forEach(el => { el.classList.remove("sb-light"); el.classList.add("sb-dark"); });
  clone.querySelectorAll(".card-light").forEach(el => { el.classList.remove("card-light"); el.classList.add("card-dark"); });
  clone.querySelectorAll(".lock-light").forEach(el => { el.classList.remove("lock-light"); el.classList.add("lock-dark"); });
  clone.querySelectorAll(".card-light-sub").forEach(el => { el.classList.remove("card-light-sub"); el.classList.add("card-dark-sub"); });
  root.appendChild(clone);
}
/* 深色版状态栏信号图标与电池描边改白 */
document.querySelectorAll(".sb-dark").forEach(el => {
  el.querySelectorAll("svg [style]").forEach(p => p.style.stroke = "#F2F5F9");
  el.querySelectorAll(".sb-icons svg rect[fill='none']").forEach(r => r.setAttribute("style", "stroke:#F2F5F9"));
});
document.title = "ready";

/* 截图辅助：?only=<key> 时只保留对应区块。key 形如 light-1/2/3, dark-1/2/3, light-all, dark-all */
const only = new URLSearchParams(location.search).get("only");
if (only) {
  const isAll = only.endsWith("-all");
  const wantLight = only.startsWith("light");
  const rootId = wantLight ? "light-root" : "dark-root";
  const stateSel = isAll ? null : "." + only.replace(/^(light|dark)-/, (m, v) => v + "-state-");
  for (const el of [...document.body.children]) {
    if (el.matches("script, h1, .meta")) continue;
    const isVersionTitle = el.classList.contains("version-title")
      && (wantLight ? el.textContent.includes("浅色") : el.textContent.includes("深色"));
    const isWantedRoot = el.id === rootId;
    const wanted = isAll ? isWantedRoot
      : isVersionTitle || (isWantedRoot && el.querySelector(stateSel));
    if (!wanted) { el.remove(); continue; }
    if (!isAll && isWantedRoot) {
      for (const s of [...el.children]) if (!s.matches(stateSel)) s.remove();
    }
  }
  document.body.style.padding = "32px 40px 40px";
}
</script>
